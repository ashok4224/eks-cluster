name: "EKS · Dev"

on:
  push:
    branches: ["dev", "feature/**"]
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/eks-dev.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "environments/dev/**"
      - "modules/**"

env:
  TF_VERSION:  "1.7.5"
  AWS_REGION:  "ap-south-1"
  WORKING_DIR: "environments/dev"

jobs:
  terraform:
    name: "Plan & Apply — dev"
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write   # required for OIDC assume-role
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -input=false -no-color
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan · \`dev\`
            | Step | Result |
            |------|--------|
            | fmt  | \`${{ steps.fmt.outcome }}\` |
            | init | \`${{ steps.init.outcome }}\` |
            | validate | \`${{ steps.validate.outcome }}\` |
            | plan | \`${{ steps.plan.outcome }}\` |

            *Actor: @${{ github.actor }} — Event: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan
